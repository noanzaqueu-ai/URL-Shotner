<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Encurtador de URL</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 520px; margin: 80px auto; padding: 0 20px; }
    input { width: 100%; padding: 10px; margin: 10px 0; box-sizing: border-box; }
    button { padding: 10px 20px; cursor: pointer; }
    .result { background: #eef; padding: 12px; border-radius: 6px; margin-top: 16px; }
    .error { color: #b00; margin-top: 8px; }
    code { font-size: 1.1em; }
  </style>
</head>
<body>
  <h1>Encurtador de URL</h1>
  <form method="POST">
    <input type="text" name="url" placeholder="https://exemplo.com/pagina-longa" required>
    <button type="submit">Encurtar</button>
  </form>

  {% if error %}
    <p class="error">{{ error }}</p>
  {% endif %}

  {% if short_url %}
    <div class="result">
      Link curto: <a href="{{ short_url }}" target="_blank"><code>{{ short_url }}</code></a>
    </div>
  {% endif %}
</body>
</html>
